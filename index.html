<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Auto-Lab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Auto-Lab</h1>
    <p>オートレース データ分析プラットフォーム</p>
</header>

<main>

    <h2>本日の開催</h2>

<div id="race-list">
    <p>開催情報を読み込んでいます...</p>
</div>
    

</main>

<script>

async function loadTodayRaces() {

    try {

        const response = await fetch('./today-races.json');

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const races = await response.json();

        console.log('★ Auto-Lab 本日の開催:', races);

        const list = document.getElementById('race-list');

        if (!list) {
            console.error('race-list が見つかりません');
            return;
        }

        if (races.length === 0) {
            list.innerHTML = '<p>本日の開催はありません。</p>';
            return;
        }

        const cards = await Promise.all(
            races.map(async race => {

                let currentRaceNo = null;
                let nearestDeadline = null;

                // 1R～12Rを確認
                for (let raceNo = 1; raceNo <= 12; raceNo++) {

                    try {

                        const raceResponse = await fetch(
                            `${race.placeKey}-${raceNo}r.json`,
                            {
                                cache: "no-store"
                            }
                        );

                        if (!raceResponse.ok) {
                            continue;
                        }

                        const data =
                            await raceResponse.json();

                        const telvoteTime =
                            data.raceInfo?.telvoteTime;

                        if (!telvoteTime) {
                            continue;
                        }

                        let [hour, minute] =
                            telvoteTime.split(":").map(Number);

                        const deadline = new Date();

                        // 24:00以降の深夜レース対応
                        if (hour >= 24) {

                            deadline.setDate(
                                deadline.getDate() + 1
                            );

                            hour -= 24;
                        }

                        deadline.setHours(
                            hour,
                            minute,
                            0,
                            0
                        );

                        const now = new Date();

                        // まだ締切前のRだけ対象
                        if (
                            deadline > now &&
                            (
                                nearestDeadline === null ||
                                deadline < nearestDeadline
                            )
                        ) {

                            nearestDeadline = deadline;
                            currentRaceNo = raceNo;

                        }

                    } catch (error) {

                        console.warn(
                            `${race.placeKey} ${raceNo}R 判定失敗:`,
                            error
                        );

                    }
                }

                return `
                    <div class="race-card">

                        <div class="race-card-header">
                            <h3>🏁 ${race.placeName}オート</h3>
                        </div>

                        <div class="race-card-info">

                            <div class="race-info-item">
                                <span class="label">開催期間</span>
                                <strong>
                                    ${race.periodStartDate} ～ ${race.periodEndDate}
                                </strong>
                            </div>

                            <div class="race-info-item">
                                <span class="label">開催日程</span>
                                <strong>
                                    第${race.paragraphday}日目
                                </strong>
                            </div>

                            <div class="race-info-item current-race">
                                <span class="label">現在のレース</span>
                                <strong>
                                    ${
                                        currentRaceNo !== null
                                            ? currentRaceNo + "R"
                                            : "終了"
                                    }
                                </strong>
                            </div>

                        </div>

                        <button
                            class="race-card-button"
                            onclick="goToRace('${race.placeKey}')">
                            ${race.placeName}のレースを見る
                        </button>

                    </div>
                `;

            })
        );

        list.innerHTML = cards.join('');

    } catch (error) {

        console.error(
            '本日の開催読み込みエラー:',
            error
        );

    }

}

function goToRace(venue) {

    if (!venue) {

        alert('開催場を判定できませんでした');

        return;

    }

    location.href = `race.html?venue=${venue}`;

}


console.log('★ JSON版 script 読み込み確認');

loadTodayRaces();

</script>

</body>

</html>
